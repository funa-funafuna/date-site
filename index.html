<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5d7df" />
    <title>聞きたい事がある</title>
    <meta name="description" content="デートの日付と食べたいメニューを選ぶミニWebサイトです。" />
    <link rel="stylesheet" href="style.css?v=20260627heart" />
  </head>
  <body>
    <main class="app-shell" id="app">
      <section class="screen screen-question is-active" id="screen-question" aria-labelledby="question-title">
        <div class="hero-illustration" aria-hidden="true">
          <span class="secret-mark">㊙️</span>
        </div>
        <h1 id="question-title"><span class="title-line">俺とデート</span><span class="title-line">行かない？</span></h1>
        <p class="support-text" id="question-hint">答えは慎重に選んでね。</p>
        <div class="choice-zone" id="choice-zone">
          <button class="primary-choice" id="yes-button" type="button">YES</button>
          <button class="secondary-choice" id="no-button" type="button">NO</button>
        </div>
      </section>

      <section class="screen screen-date" id="screen-date" aria-labelledby="date-title" hidden>
        <h2 id="date-title">そう言うと思ったよ！</h2>
        <p class="support-text">いつ行くか決めよ。</p>

        <div class="date-picker" aria-label="デートの日付を選択">
          <div class="calendar-top">
            <button class="icon-button" id="prev-month" type="button" aria-label="前の月">‹</button>
            <p class="calendar-title" id="calendar-title"></p>
            <button class="icon-button" id="next-month" type="button" aria-label="次の月">›</button>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span>日</span>
            <span>月</span>
            <span>火</span>
            <span>水</span>
            <span>木</span>
            <span>金</span>
            <span>土</span>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <label class="field-label" for="time-select">何時から？</label>
        <select class="time-select" id="time-select"></select>
        <p class="selection-preview" id="date-preview">日付を選んでね。</p>
        <button class="next-button" id="to-menu-button" type="button" disabled>次へ</button>
      </section>

      <section class="screen screen-menu" id="screen-menu" aria-labelledby="menu-title" hidden>
        <h2 id="menu-title">何食べに行く？</h2>

        <div class="menu-grid" id="menu-grid" aria-label="食べたいメニューを選択"></div>
      </section>

      <section class="screen screen-summary" id="screen-summary" aria-labelledby="summary-title" hidden>
        <div class="summary-visual" aria-hidden="true">♡</div>
        <h2 id="summary-title">デート決定！</h2>
        <div class="summary-box">
          <p class="summary-label">日時</p>
          <p class="summary-value" id="summary-date"></p>
          <p class="summary-label">メニュー</p>
          <p class="summary-value menu-result" id="summary-menu"></p>
        </div>
        <p class="screenshot-message">この画面をスクショして送ってね。</p>
        <button class="ghost-button" id="restart-button" type="button">もう一度選ぶ</button>
      </section>
    </main>

    <script src="script.js?v=20260627heart"></script>
  </body>
</html>
