<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5d7df">
<title>聞きたい事がある</title>
<style>
:root{--paper:#fffdf8;--rose:#e3547e;--rose-dark:#a72e55;--mint:#3ba889;--mint-dark:#17795f;--navy:#26314b;--ink:#33223a;--muted:#7b6d7c;--line:rgba(51,34,58,.14);--shadow:0 26px 70px rgba(70,42,74,.2)}*{box-sizing:border-box}[hidden]{display:none!important}body{min-height:100svh;margin:0;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",YuGothic,system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(227,84,126,.22),transparent 28%),radial-gradient(circle at 92% 18%,rgba(59,168,137,.2),transparent 30%),linear-gradient(135deg,#f6dbe1 0%,#fff2de 48%,#dceee9 100%)}button,select{font:inherit;-webkit-tap-highlight-color:transparent}button{border:0;cursor:pointer}.app{width:min(520px,100%);min-height:100svh;margin:0 auto;display:grid;place-items:center;padding:18px;overflow:hidden}.screen{position:relative;width:100%;min-height:min(780px,calc(100svh - 36px));display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:28px 22px 24px;border:1px solid rgba(255,255,255,.78);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,253,248,.96)),var(--paper);box-shadow:var(--shadow);text-align:center}.screen:before{content:"";position:absolute;inset:14px;z-index:0;border:1px solid rgba(167,46,85,.11);border-radius:20px;pointer-events:none}.screen>*{position:relative;z-index:1}.screen.is-entering{animation:enter .36s cubic-bezier(.22,1,.36,1)}h1,h2{width:100%;margin:0;color:var(--navy);font-family:"Yu Mincho",YuMincho,"Hiragino Mincho ProN",serif;font-weight:800;line-height:1.22;letter-spacing:0;overflow-wrap:anywhere}h1{margin-top:22px;font-size:clamp(2.25rem,9vw,3.45rem)}h2{margin-top:16px;font-size:clamp(2rem,8vw,3.1rem)}.line{display:block}.support{max-width:330px;margin:12px 0 0;color:var(--muted);font-size:.96rem;line-height:1.7}.hero{width:min(300px,74vw);aspect-ratio:1/.82;display:grid;place-items:center;margin-top:34px}.secret{width:min(210px,54vw);aspect-ratio:1;display:grid;place-items:center;border:5px solid rgba(167,46,85,.16);border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.9),transparent 24%),linear-gradient(145deg,#fff4c7,#ffcf63 55%,#f09a42);font-size:clamp(5.6rem,29vw,8.4rem);line-height:1;box-shadow:0 20px 38px rgba(149,86,27,.2);animation:float 2.8s ease-in-out infinite}.choice-zone{position:relative;width:100%;flex:1;min-height:250px;margin-top:24px}.yes,.no{position:absolute;top:72px;width:124px;min-height:60px;border-radius:16px;color:#fff;font-size:1.18rem;font-weight:900;letter-spacing:.08em;box-shadow:0 9px 0 rgba(38,49,75,.12),0 18px 28px rgba(38,49,75,.16);transition:width .26s cubic-bezier(.2,1,.3,1),min-height .26s cubic-bezier(.2,1,.3,1),left .26s cubic-bezier(.2,1,.3,1),top .26s cubic-bezier(.2,1,.3,1),transform .24s cubic-bezier(.2,1,.3,1),border-width .22s ease,font-size .22s ease;user-select:none}.yes{left:calc(50% - 136px);z-index:3;border:2px solid var(--mint-dark);background:linear-gradient(180deg,#4fc49c,var(--mint));transform-origin:center}.no{left:calc(50% + 12px);z-index:2;border:2px solid var(--rose-dark);background:linear-gradient(180deg,#f46d8c,var(--rose));transform-origin:center}.datebox{width:100%;margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.68)}.cal-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}.icon{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;font-size:2rem;line-height:1}.cal-title{margin:0;color:var(--navy);font-weight:900}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.week{margin:14px 0 8px;color:var(--muted);font-size:.78rem;font-weight:800}.day{width:100%;aspect-ratio:1;border-radius:12px;background:#fff;color:var(--ink);font-size:.94rem;font-weight:850;box-shadow:inset 0 0 0 1px var(--line)}.day:disabled{cursor:not-allowed;color:rgba(51,34,58,.25);background:rgba(255,255,255,.44)}.day.selected{background:var(--rose);color:#fff;box-shadow:0 9px 18px rgba(167,46,85,.2)}.day.today{box-shadow:inset 0 0 0 2px var(--mint)}.empty{aspect-ratio:1}.label{align-self:flex-start;margin:18px 0 8px;color:var(--navy);font-size:.86rem;font-weight:900}.time{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:800}.preview{width:100%;min-height:52px;display:grid;place-items:center;margin:16px 0 0;padding:12px;border-radius:14px;background:#f7ecf0;color:var(--rose-dark);font-weight:900;line-height:1.45}.next,.again{width:100%;min-height:56px;margin-top:auto;border-radius:16px;font-weight:900}.next{background:var(--navy);color:#fff;box-shadow:0 14px 26px rgba(38,49,75,.18)}.next:disabled{cursor:not-allowed;opacity:.42}.menu-grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}.menu-card{min-height:142px;display:grid;align-content:center;justify-items:center;gap:9px;padding:14px 8px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 12px 26px rgba(70,42,74,.1)}.menu-ill{min-height:58px;display:grid;place-items:center;font-size:clamp(2.5rem,11vw,3.5rem);line-height:1}.menu-name{font-size:1.05rem;font-weight:900}.heart{width:104px;height:104px;display:grid;place-items:center;margin:18px 0 10px;border-radius:50%;background:linear-gradient(145deg,#ff789c,#d93f73);color:#fff;font-size:4.4rem;line-height:1;box-shadow:0 18px 34px rgba(167,46,85,.2)}.summary{width:100%;margin-top:28px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left}.s-label{margin:0 0 6px;color:var(--muted);font-size:.78rem;font-weight:900}.s-value{margin:0 0 18px;color:var(--navy);font-size:1.24rem;font-weight:950;line-height:1.45}.shot{width:100%;margin:22px 0 0;padding:16px;border-radius:18px;background:#f7ecf0;color:var(--rose-dark);font-size:1.05rem;font-weight:900;line-height:1.55}.again{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px rgba(38,49,75,.18)}@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(4deg)}}@media(max-width:390px){.app{padding:10px}.screen{min-height:calc(100svh - 20px);padding:22px 16px 18px;border-radius:22px}.menu-grid{gap:9px}.menu-card{min-height:122px}}@media(max-height:720px){.hero{width:min(245px,70vw);margin-top:0}h1{margin-top:12px}.choice-zone{min-height:196px}.menu-card{min-height:116px}}
</style>
</head>
<body>
<main class="app">
<section class="screen" id="q"><div class="hero"><span class="secret">㊙️</span></div><h1><span class="line">俺とデート</span><span class="line">行かない？</span></h1><p class="support" id="hint">答えは慎重に選んでね。</p><div class="choice-zone" id="zone"><button class="yes" id="yes" type="button">YES</button><button class="no" id="no" type="button">NO</button></div></section>
<section class="screen" id="date" hidden><h2>そう言うと思ったよ！</h2><p class="support">いつ行くか決めよ。</p><div class="datebox"><div class="cal-top"><button class="icon" id="prev" type="button">‹</button><p class="cal-title" id="ct"></p><button class="icon" id="next" type="button">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="grid" id="grid"></div></div><label class="label" for="time">何時から？</label><select class="time" id="time"></select><p class="preview" id="preview">日付を選んでね。</p><button class="next" id="toMenu" type="button" disabled>次へ</button></section>
<section class="screen" id="menu" hidden><h2>何食べに行く？</h2><div class="menu-grid" id="menus"></div></section>
<section class="screen" id="sum" hidden><div class="heart">♡</div><h2>デート決定！</h2><div class="summary"><p class="s-label">日時</p><p class="s-value" id="sumDate"></p><p class="s-label">メニュー</p><p class="s-value" id="sumMenu"></p></div><p class="shot">この画面をスクショして送ってね。</p><button class="again" id="again" type="button">もう一度選ぶ</button></section>
</main>
<script>
const screens={q:document.getElementById('q'),date:document.getElementById('date'),menu:document.getElementById('menu'),sum:document.getElementById('sum')},zone=document.getElementById('zone'),yes=document.getElementById('yes'),no=document.getElementById('no'),hint=document.getElementById('hint'),ct=document.getElementById('ct'),grid=document.getElementById('grid'),prev=document.getElementById('prev'),next=document.getElementById('next'),time=document.getElementById('time'),preview=document.getElementById('preview'),toMenu=document.getElementById('toMenu'),menusEl=document.getElementById('menus'),sumDate=document.getElementById('sumDate'),sumMenu=document.getElementById('sumMenu'),again=document.getElementById('again');
const w=['日','月','火','水','木','金','土'],today=strip(new Date()),items=[['寿司','🍣','🍣'],['焼肉','🥩','🥩'],['ラーメン','🍜','🍜'],['鰻','？','？'],['パスタ','🍝','🍝'],['スイーツ','🍰','🍰']];
const state={month:new Date(today.getFullYear(),today.getMonth(),1),date:null,time:'18:00',menu:null,no:0};
function strip(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function key(d){return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}function fd(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w[d.getDay()]}）`}function ft(t){const [h,m]=t.split(':');return `${Number(h)}時${m}分から`}function show(n){Object.values(screens).forEach(s=>s.hidden=true);screens[n].hidden=false;screens[n].classList.add('is-entering')}function dodge(e){if(e)e.preventDefault();state.no++;const r=zone.getBoundingClientRect(),ns=Math.max(.34,1-state.no*.1),ys=Math.min(1.65,1+state.no*.12),yw=Math.min(r.width-52,124+state.no*8);no.style.left=`${Math.random()*Math.max(0,r.width-no.offsetWidth*ns)}px`;no.style.top=`${Math.random()*Math.max(0,r.height-no.offsetHeight*ns)}px`;no.style.transform=`scale(${ns}) rotate(${state.no%2?-7:7}deg)`;yes.style.width=`${yw}px`;yes.style.minHeight=`${Math.min(86,60+state.no*4)}px`;yes.style.left=`${(r.width-yw)/2}px`;yes.style.top=`${Math.max(36,72-state.no*3)}px`;yes.style.borderWidth=`${Math.min(6,2+state.no)}px`;yes.style.fontSize=`${Math.min(1.7,1.18+state.no*.1)}rem`;yes.style.transform=`scale(${ys})`;hint.textContent=['NOは今日は休みみたい。','押せそうで押せないよ。','そろそろYESにしよ？','YESが待ってるよ。'][Math.min(state.no-1,3)]}function times(){for(let h=10;h<=22;h++)['00','30'].forEach(m=>{if(h===22&&m==='30')return;const v=`${String(h).padStart(2,'0')}:${m}`,o=document.createElement('option');o.value=v;o.textContent=`${h}時${m}分`;if(v===state.time)o.selected=true;time.append(o)})}function cal(){grid.replaceChildren();const y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();ct.textContent=`${y}年${m+1}月`;prev.disabled=new Date(y,m,0)<today;for(let i=0;i<first.getDay();i++){const s=document.createElement('span');s.className='empty';grid.append(s)}for(let d=1;d<=days;d++){const cur=new Date(y,m,d),b=document.createElement('button');b.className='day';b.type='button';b.textContent=d;b.disabled=cur<today;if(key(cur)===key(today))b.classList.add('today');if(state.date&&key(cur)===key(state.date))b.classList.add('selected');b.onclick=()=>{state.date=cur;update();cal()};grid.append(b)}}function update(){if(!state.date){preview.textContent='日付を選んでね。';toMenu.disabled=true;return}preview.textContent=`${fd(state.date)} ${ft(state.time)}`;toMenu.disabled=false}function menu(){menusEl.replaceChildren();items.forEach(([name,icon,summary])=>{const b=document.createElement('button');b.className='menu-card';b.type='button';b.innerHTML=`<span class="menu-ill">${icon}</span><span class="menu-name">${name}</span>`;b.onclick=()=>{state.menu={name,summary};sumDate.textContent=`${fd(state.date)} ${ft(state.time)}`;sumMenu.textContent=[summary,name].filter(Boolean).join(' ');show('sum')};menusEl.append(b)})}
yes.onclick=()=>show('date');['pointerenter','pointerdown','focus','click'].forEach(ev=>no.addEventListener(ev,dodge));prev.onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);cal()};next.onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);cal()};time.onchange=()=>{state.time=time.value;update()};toMenu.onclick=()=>state.date&&show('menu');again.onclick=()=>{state.date=null;state.menu=null;state.time='18:00';state.month=new Date(today.getFullYear(),today.getMonth(),1);time.value=state.time;update();cal();show('date')};times();cal();menu();update();
</script>
</body>
</html>
